[build]
command = """
    wget -qO- https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.9-stable.tar.xz | tar xJ
    export PATH="$PWD/flutter/bin:$PATH"
    flutter pub get
    flutter build web --release --verbose
  """
publish = "build/web"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200